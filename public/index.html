<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shop A demo cart</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page-shell">
    <div class="eyebrow">Shop A — demo cart</div>
    <h1>Shop A</h1>
    <p class="text-muted">Demo cart for manual testing — not a real store.</p>

    <div class="panel">
      <div class="item-row">
        <span class="item-name">Sample item</span>
        <label class="amount-field">
          A$
          <input type="text" id="amount" value="1.00" inputmode="decimal" aria-label="Amount in dollars">
        </label>
      </div>
      <button id="checkout-button" class="btn btn-primary">Checkout</button>
    </div>

    <div id="status"></div>
  </main>

  <script type="module">
    const button = document.getElementById('checkout-button');
    const amountInput = document.getElementById('amount');
    const statusEl = document.getElementById('status');

    function showStatus(text, tone) {
      statusEl.innerHTML = `<div class="status-message" data-tone="${tone}"><p>${text}</p></div>`;
    }

    button.addEventListener('click', async () => {
      const dollars = Number.parseFloat(amountInput.value);
      if (!Number.isFinite(dollars) || dollars <= 0) {
        showStatus('Enter a valid amount greater than zero.', 'danger');
        return;
      }

      // Convert major units (dollars) to minor units (cents) as an integer.
      // Rounding here, once, is the only place this UI touches money math —
      // everything past this point is an integer, per prd.md's money rule.
      const amountMinorUnits = Math.round(dollars * 100);

      button.disabled = true;
      showStatus('Creating order...', 'neutral');

      try {
        const response = await fetch('/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: amountMinorUnits, currency: 'AUD' }),
        });

        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          showStatus('Could not create order: ' + (body.error || response.status), 'danger');
          button.disabled = false;
          return;
        }

        const { orderReference } = await response.json();
        window.location.href = `/checkout.html?order=${orderReference}`;
      } catch (err) {
        showStatus('An error occurred creating the order.', 'danger');
        console.error(err);
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
