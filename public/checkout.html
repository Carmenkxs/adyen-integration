<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shop A checkout</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/vendor/adyen-web/adyen.css">
</head>
<body>
  <main class="page-shell">
    <div class="eyebrow">Shop A — checkout</div>
    <div id="status"></div>
    <div id="dropin-container"></div>
  </main>

  <script type="module">
    import { AdyenCheckout, Dropin, Card } from '/vendor/adyen-web/index.js';
    import { getResultMessage, getOrderStatusMessage } from '/result-messages.js';

    const POLL_INTERVAL_MS = 1500;
    const POLL_TIMEOUT_MS = 20000;

    const params = new URLSearchParams(window.location.search);
    const orderReference = params.get('order');
    const statusEl = document.getElementById('status');

    function showResult(resultCode) {
      const { tone, heading, body } = getResultMessage(resultCode);
      statusEl.innerHTML = `<div class="status-message" data-tone="${tone}"><h2>${heading}</h2><p>${body}</p><p class="polling">Checking for final confirmation...</p></div>`;
      // Drop-in shows its own generic result overlay once a payment attempt
      // finishes; there's no documented way to suppress just that overlay
      // while keeping the component mounted. Removing it avoids showing our
      // specific message alongside Drop-in's own generic one.
      document.getElementById('dropin-container').remove();
      pollForConfirmation();
    }

    async function pollForConfirmation() {
      const deadline = Date.now() + POLL_TIMEOUT_MS;

      while (Date.now() < deadline) {
        await new Promise((resolve) => setTimeout(resolve, POLL_INTERVAL_MS));

        let order;
        try {
          const response = await fetch(`/orders/${orderReference}`);
          if (!response.ok) continue;
          order = await response.json();
        } catch {
          continue;
        }

        const finalMessage = getOrderStatusMessage(order.status);
        if (finalMessage) {
          statusEl.innerHTML = `<div class="status-message" data-tone="${finalMessage.tone}"><h2>${finalMessage.heading}</h2><p>${finalMessage.body}</p></div>`;
          return;
        }
      }

      // Timed out without reaching a confirmed status. Not a failure claim —
      // just honest that we don't know yet.
      const pollingEl = statusEl.querySelector('.polling');
      if (pollingEl) {
        pollingEl.textContent = "This is taking longer than expected. Check back shortly, or contact support with your order reference if this persists.";
        pollingEl.classList.remove('polling');
      }
    }

    function showPlainText(text) {
      statusEl.innerHTML = `<div class="status-message" data-tone="neutral"><p>${text}</p></div>`;
    }

    if (!orderReference) {
      showPlainText('Missing order reference. Append ?order=&lt;orderReference&gt; to this URL.');
    } else {
      try {
        const sessionResponse = await fetch(`/orders/${orderReference}/session`, { method: 'POST' });
        if (!sessionResponse.ok) {
          const body = await sessionResponse.json().catch(() => ({}));
          showPlainText('Could not start checkout: ' + (body.error || sessionResponse.status));
        } else {
          const session = await sessionResponse.json();

          const checkout = await AdyenCheckout({
            environment: 'test',
            clientKey: session.clientKey,
            countryCode: 'AU',
            session: { id: session.id, sessionData: session.sessionData },
            onPaymentCompleted: (data) => {
              // Provisional only. The order is not confirmed until the webhook arrives.
              showResult(data.resultCode);
            },
            onPaymentFailed: (data) => {
              showResult(data && data.resultCode);
            },
            onError: (error) => {
              showResult('Error');
              console.error(error);
            },
          });

          new Dropin(checkout, { paymentMethodComponents: [Card] }).mount('#dropin-container');
        }
      } catch (err) {
        showResult('Error');
        console.error(err);
      }
    }
  </script>
</body>
</html>
