<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shop A checkout</title>
  <link rel="stylesheet" href="/vendor/adyen-web/adyen.css">
  <style>
    #status { margin-bottom: 1rem; }
    #status h2 { margin: 0 0 0.25rem; font-size: 1.1rem; }
    #status p { margin: 0; color: #444; }
  </style>
</head>
<body>
  <div id="status"></div>
  <div id="dropin-container"></div>

  <script type="module">
    import { AdyenCheckout, Dropin, Card } from '/vendor/adyen-web/index.js';
    import { getResultMessage } from '/result-messages.js';

    const params = new URLSearchParams(window.location.search);
    const orderReference = params.get('order');
    const statusEl = document.getElementById('status');

    function showResult(resultCode) {
      const { heading, body } = getResultMessage(resultCode);
      statusEl.innerHTML = `<h2>${heading}</h2><p>${body}</p>`;
      // Drop-in shows its own generic result overlay once a payment attempt
      // finishes; there's no documented way to suppress just that overlay
      // while keeping the component mounted. Removing it avoids showing our
      // specific message alongside Drop-in's own generic one.
      document.getElementById('dropin-container').remove();
    }

    function showPlainText(text) {
      statusEl.textContent = text;
    }

    if (!orderReference) {
      showPlainText('Missing order reference. Append ?order=<orderReference> to this URL.');
    } else {
      try {
        const sessionResponse = await fetch(`/orders/${orderReference}/session`, { method: 'POST' });
        if (!sessionResponse.ok) {
          const body = await sessionResponse.json().catch(() => ({}));
          showPlainText('Could not start checkout: ' + (body.error || sessionResponse.status));
        } else {
          const session = await sessionResponse.json();

          const checkout = await AdyenCheckout({
            environment: 'test',
            clientKey: session.clientKey,
            countryCode: 'AU',
            session: { id: session.id, sessionData: session.sessionData },
            onPaymentCompleted: (data) => {
              // Provisional only. The order is not confirmed until the webhook arrives.
              showResult(data.resultCode);
            },
            onPaymentFailed: (data) => {
              showResult(data && data.resultCode);
            },
            onError: (error) => {
              showResult('Error');
              console.error(error);
            },
          });

          new Dropin(checkout, { paymentMethodComponents: [Card] }).mount('#dropin-container');
        }
      } catch (err) {
        showResult('Error');
        console.error(err);
      }
    }
  </script>
</body>
</html>
